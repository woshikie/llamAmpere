name: TurboQuant+ Release

on:
  push:
    tags:
      - 'tqp-v*'
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Which builds to run (tag pushes always run all)'
        required: true
        default: 'cuda-both'
        type: choice
        options:
          - windows-cuda
          - linux-cuda
          - cuda-both
          - linux
          - all

env:
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON"

jobs:
  macos-metal:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' }}
    runs-on: macos-14

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build
        run: |
          cmake -B build \
            -DGGML_METAL_USE_BF16=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(sysctl -n hw.logicalcpu)

      - name: Pack
        run: |
          cp LICENSE ./build/bin/
          tar -czvf turboquant-plus-${{ github.ref_name }}-macos-arm64-metal.tar.gz \
            -s ",./,turboquant-plus-${{ github.ref_name }}/," -C ./build/bin .

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-metal
          path: turboquant-plus-${{ github.ref_name }}-macos-arm64-metal.tar.gz

  windows-cuda:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'windows-cuda' || inputs.jobs == 'cuda-both' }}
    runs-on: windows-2022

    strategy:
      matrix:
        cuda: ['12.4']

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda }}

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DCMAKE_CUDA_ARCHITECTURES="80-real;86-real;87-real;89-real;90-real;90-virtual" ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            ${{ env.CMAKE_ARGS }}
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Pack
        run: |
          cp LICENSE ./build/bin/Release/
          $dst='.\build\bin\Release\'
          robocopy "${{env.CUDA_PATH}}\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "${{env.CUDA_PATH}}\lib" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          robocopy "${{env.CUDA_PATH}}\bin\x64" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          7z a turboquant-plus-${{ github.ref_name }}-windows-x64-cuda${{ matrix.cuda }}.zip .\build\bin\Release\*

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-cuda${{ matrix.cuda }}
          path: turboquant-plus-${{ github.ref_name }}-windows-x64-cuda${{ matrix.cuda }}.zip

  linux-cuda:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'linux-cuda' || inputs.jobs == 'cuda-both' }}
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04

    strategy:
      matrix:
        cuda: ['12.4']

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          apt-get update && apt-get install -y build-essential libssl-dev ninja-build cmake git

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_FA_ALL_QUANTS=ON \
            -DCMAKE_CUDA_ARCHITECTURES="80-real;86-real;87-real;89-real;90-real;90-virtual" \
            -DLLAMA_BUILD_BORINGSSL=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build -j $(nproc)

      - name: Pack
        run: |
          cp LICENSE ./build/bin/
          CUDA_LIB=$(dirname $(dirname $(command -v nvcc)))/lib64
          cp "$CUDA_LIB"/libcudart.so* "$CUDA_LIB"/libcublas.so* "$CUDA_LIB"/libcublasLt.so* ./build/bin/ 2>/dev/null || true
          tar -czvf turboquant-plus-${{ github.ref_name }}-linux-x64-cuda${{ matrix.cuda }}.tar.gz -C ./build/bin .

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-cuda${{ matrix.cuda }}
          path: turboquant-plus-${{ github.ref_name }}-linux-x64-cuda${{ matrix.cuda }}.tar.gz

  linux-cpu:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'linux' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack
        run: |
          cp LICENSE ./build/bin/
          tar -czvf turboquant-plus-${{ github.ref_name }}-linux-x64-cpu.tar.gz \
            --transform "s,^\.,turboquant-plus-${{ github.ref_name }}," -C ./build/bin .

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-cpu
          path: turboquant-plus-${{ github.ref_name }}-linux-x64-cpu.tar.gz

  linux-vulkan:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'linux' }}
    runs-on: ubuntu-22.04

    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Dependencies
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev

      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_VULKAN=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)

      - name: Pack
        run: |
          cp LICENSE ./build/bin/
          tar -czvf turboquant-plus-${{ github.ref_name }}-linux-x64-vulkan.tar.gz \
            --transform "s,^\.,turboquant-plus-${{ github.ref_name }}," -C ./build/bin .

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64-vulkan
          path: turboquant-plus-${{ github.ref_name }}-linux-x64-vulkan.tar.gz

  release:
    # Button pushes (workflow_dispatch) upload artifacts but never cut a
    # release; only tag pushes publish. Skipped build jobs satisfy `needs`.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos-metal, windows-cuda, linux-cuda, linux-cpu, linux-vulkan]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./release
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TurboQuant+ ${{ github.ref_name }}
          files: ./release/*
          draft: false
          prerelease: false
